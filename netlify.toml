# netlify.toml — Canyonland Technologies

[build]
  publish = "."       # Plain HTML/CSS/JS, served from the repo root
  command = ""        # No build step

# Canonical host: send the apex domain to www (matches <link rel="canonical">).
# Netlify handles the HTTP→HTTPS upgrade itself, so only the https origin is listed.
[[redirects]]
  from = "https://canyonlandtech.com/*"
  to = "https://www.canyonlandtech.com/:splat"
  status = 301
  force = true

# Netlify also serves the site on its own subdomains. Those hosts are real,
# public and indexable, and they duplicate every page at a non-canonical
# address. The <link rel="canonical"> tags already point search engines at the
# right domain; these send the visitor there too, so there is one address for
# the site rather than three.
#
# The production deploy is NOT deleted to achieve this. That deploy is what
# serves www.canyonlandtech.com, and main--canyonlandtech.netlify.app is an
# alias of it, not a separate build — both return the same ETag. Removing it
# would take the site down.
#
# Both hosts are named explicitly rather than matched with a *.netlify.app
# wildcard, because such a wildcard would also catch
# deploy-preview-<n>--canyonlandtech.netlify.app and redirect every pull
# request's preview to production. Reviewing on the deploy preview is the last
# checkpoint before going live; a rule that quietly disables it would cost far
# more than the duplicate hostname it fixes.
[[redirects]]
  from = "https://main--canyonlandtech.netlify.app/*"
  to = "https://www.canyonlandtech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://canyonlandtech.netlify.app/*"
  to = "https://www.canyonlandtech.com/:splat"
  status = 301
  force = true

# The Lab's corpus generator and its verifier live in the repo so the synthetic
# data is reproducible, but they are authoring tools, not part of the site.
# Serve the 404 page rather than the Python source.
[[redirects]]
  from = "/lab/tools/*"
  to = "/404.html"
  status = 404
  # Without force, an existing file wins over the rule and the source is served
  # anyway — which is exactly what happened on the first deploy preview.
  force = true

# Asset filenames here are dimension-based (logo-400.png, favicon-32.png), not
# content-hashed, so they are mutable: replacing a logo reuses its name. A
# year-long cache meant returning visitors could keep the old file for up to a
# year after a change. Fresh for an hour, then served stale only while a
# revalidation runs in the background, so an updated asset propagates promptly
# without giving up caching. Restore a long immutable cache only if these names
# gain content hashes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
